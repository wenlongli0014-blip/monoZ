selections:

- formula: "abs(probe_eta) <= 1.4442 && event_cat == 0"
  weight: weight
  tag: barrel_ee
  label: "barrel_ee"

- formula: "abs(probe_eta) <= 1.4442 && event_cat == 1"
  weight: weight
  tag: barrel_egamma
  label: "barrel_egamma"

- formula: "abs(probe_eta) >= 1.5660 && event_cat == 0"
  weight: weight
  tag: endcap_ee
  label: "endcap_ee"

- formula: "abs(probe_eta) >= 1.5660 && event_cat == 1"
  weight: weight
  tag: endcap_egamma
  label: "endcap_egamma"


samples:
  path_prefix: ""
  data:
    files: [Data]
  simulation:
    - label: "$W\\gamma \\to \\ell\\nu\\gamma$"
      files: [WGToLNuG]
      color: blueviolet
    - label: "WJetsToLNu\n(NLO)"
      files: [WJetsToLNu_0J, WJetsToLNu_1J, WJetsToLNu_2J]
      color: palevioletred
    # - label: "$\\gamma + $jets"
    #   files: [GJets]
    #   color: darkorange
    - label: "$t\\bar t$"
      files: [TTJets]
      color: greenyellow
    - label: "Single-top"
      files: [ST_t-channel, ST_tW, ST_s-channel]
      color: yellow
    - label: "$WW(\\to 2\\ell 2\\nu)$"
      files: [WWTo2L2Nu]
      color: lightseagreen
    - label: "$WZ$"
      files: [WZTo3LNu, WZTo2Q2L]
      color: mediumseagreen
    - label: "$ZZ$"
      files: [ZZTo2L2Nu, ZZTo2Q2L, ZZTo4L]
      color: seagreen
    - label: "Drell-Yan"
      files: [DYJetsToLL_PtZ]
      color: steelblue


variables:
- formula: "tot_mass"
  binning:
    default:
      range: [76., 106.]
      bins: 30
  x_scale: linear
  label: "$m_\\mathrm{tot}$"
  unit: GeV
  tag: tot_mass
- formula: "probe_pt"
  binning:
    default:
      range: [60., 450.]
      bins: 20
  x_scale: log
  label: "$p_\\mathrm{T}^{\\mathrm{probe}}$"
  unit: GeV
  tag: pt_probe
- formula: "probe_phi"
  binning:
    default:
      range: [-4., 4.]
      bins: 40
  x_scale: linear
  label: "$\\phi^{\\mathrm{probe}}$"
  unit: 
  tag: phi_probe
- formula: "ptmiss"
  binning:
    default:
      range: [10., 1000.]
      bins: 20
  x_scale: log
  label: "$p_\\mathrm{T}^{miss}$"
  unit: GeV
  tag: pt_miss
- formula: "jet_size"
  binning:
    default:
      range: [0, 6]
      bins: 6
  x_scale: linear
  label: "$N_{jets}$"
  unit: 
  tag: njets
